name: Regenerate tight resume PDF

on:
  push:
    branches:
      - interview-learning-delta
    paths:
      - resume.css
      - resume.html
      - .github/workflows/regenerate-tight-resume.yml

permissions:
  contents: write

jobs:
  build-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: interview-learning-delta
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium renderer
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Generate PDF
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const path = require('path');
          (async () => {
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage();
            await page.goto('file://' + path.resolve('resume.html'), {waitUntil: 'networkidle'});
            await page.emulateMedia({media: 'print'});
            await page.pdf({
              path: 'docs/Russell-Dudek-PNC-Enterprise-AI-Resume.pdf',
              format: 'Letter',
              printBackground: true,
              margin: {top: '0', right: '0', bottom: '0', left: '0'}
            });
            await browser.close();
          })();
          JS

      - name: Validate exact pagination and source text
        run: |
          python -m pip install pypdf
          python <<'PY'
          from pypdf import PdfReader
          path = 'docs/Russell-Dudek-PNC-Enterprise-AI-Resume.pdf'
          reader = PdfReader(path)
          assert len(reader.pages) == 2, f'Expected 2 pages, found {len(reader.pages)}'
          text = '\n'.join((page.extract_text() or '') for page in reader.pages)
          for phrase in ['Russell Dudek','Vape-Jet','DudeWorth','Amazon','Compunetics','Food Safety Management Certification','Scale the work']:
              assert phrase in text, f'Missing expected text: {phrase}'
          PY

      - name: Commit PDF and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Russell-Dudek-PNC-Enterprise-AI-Resume.pdf
          git rm .github/workflows/regenerate-tight-resume.yml
          git commit -m "Regenerate tighter resume PDF"
          git push origin HEAD:interview-learning-delta
