name: Regenerate formatted resume

on:
  push:
    branches:
      - interview-learning-delta
    paths:
      - resume.css
      - documents.css
      - resume.html
      - .github/workflows/regenerate-resume-format.yml

permissions:
  contents: write

jobs:
  build-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: interview-learning-delta
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF renderer
        run: pip install weasyprint pypdf

      - name: Generate and validate resume PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          from weasyprint import HTML

          root = Path.cwd()
          output = root / 'docs' / 'Russell-Dudek-PNC-Enterprise-AI-Resume.pdf'
          HTML(filename=str(root / 'resume.html'), base_url=str(root)).write_pdf(str(output))

          reader = PdfReader(str(output))
          assert len(reader.pages) == 2, f'Expected 2 pages, found {len(reader.pages)}'
          text = '\n'.join((page.extract_text() or '') for page in reader.pages)
          required = [
              'Russell Dudek',
              'Vape-Jet',
              'DudeWorth',
              'Amazon',
              'Compunetics',
              'Food Safety Management Certification',
              'Scale the work',
          ]
          for phrase in required:
              assert phrase in text, f'Missing expected resume text: {phrase}'
          PY

      - name: Commit PDF and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Russell-Dudek-PNC-Enterprise-AI-Resume.pdf
          git rm .github/workflows/regenerate-resume-format.yml
          git commit -m "Regenerate formatted resume PDF" || exit 0
          git push origin HEAD:interview-learning-delta
