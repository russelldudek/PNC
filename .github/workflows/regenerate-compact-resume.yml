name: Regenerate compact resume PDF

on:
  push:
    branches:
      - fix/compact-resume-layout-20260804
    paths:
      - resume.css
      - resume.html
      - .github/workflows/regenerate-compact-resume.yml

permissions:
  contents: write

jobs:
  build-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/compact-resume-layout-20260804
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium renderer
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Generate PDF
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const path = require('path');
          (async () => {
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage({viewport: {width: 816, height: 1056}});
            await page.goto('file://' + path.resolve('resume.html'), {waitUntil: 'networkidle'});
            await page.emulateMedia({media: 'print'});
            const pageCount = await page.locator('.resume-page').count();
            if (pageCount !== 2) throw new Error(`Expected 2 resume sections, found ${pageCount}`);
            const metrics = await page.evaluate(() => [...document.querySelectorAll('.resume-page')].map((p) => {
              const footer = p.querySelector('.page-footer');
              const items = [...p.children].filter(x => x !== footer);
              const last = items[items.length - 1];
              const pr = p.getBoundingClientRect();
              const fr = footer.getBoundingClientRect();
              const lr = last.getBoundingClientRect();
              return {height: pr.height, scrollHeight: p.scrollHeight, gap: fr.top - lr.bottom};
            }));
            metrics.forEach((m, i) => {
              if (m.scrollHeight > m.height + 1) throw new Error(`Page ${i + 1} overflows: ${JSON.stringify(m)}`);
              if (m.gap < 0 || m.gap > 105) throw new Error(`Page ${i + 1} has excessive whitespace: ${JSON.stringify(m)}`);
            });
            await page.pdf({
              path: 'docs/Russell-Dudek-PNC-Enterprise-AI-Resume.pdf',
              format: 'Letter',
              printBackground: true,
              preferCSSPageSize: true,
              margin: {top: '0', right: '0', bottom: '0', left: '0'}
            });
            console.log(metrics);
            await browser.close();
          })();
          JS

      - name: Validate exact pagination and text
        run: |
          python -m pip install pypdf
          python <<'PY'
          from pypdf import PdfReader
          path = 'docs/Russell-Dudek-PNC-Enterprise-AI-Resume.pdf'
          reader = PdfReader(path)
          assert len(reader.pages) == 2, f'Expected 2 pages, found {len(reader.pages)}'
          text = '\n'.join((page.extract_text() or '') for page in reader.pages)
          for phrase in ['RUSSELL DUDEK','Vape-Jet','DudeWorth','Amazon','Compunetics','Selected AI Engineering Mechanisms','Hands-On AI Engineering Approach']:
              assert phrase in text, f'Missing expected text: {phrase}'
          PY

      - name: Commit PDF and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Russell-Dudek-PNC-Enterprise-AI-Resume.pdf
          git rm .github/workflows/regenerate-compact-resume.yml
          git commit -m "Regenerate approved compact resume PDF"
          git push origin HEAD:fix/compact-resume-layout-20260804
